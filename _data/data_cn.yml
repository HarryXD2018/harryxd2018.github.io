career-profile:
    title: 个人简介
    summary: |
        我是北京航空航天大学的博士研究生，师从<a href="https://scholar.google.com/citations?user=hn0KFx8AAAAJ" target="_blank" style="color:#425F67"><u>李帅教授</u></a>，同时在快手可灵团队担任研究实习生。我的研究围绕人脸行为的**理解**与**生成**展开，目前聚焦于**对话式数字人**。此外，我也担任 ICLR、CVPR、ECCV 和 ECAI 的审稿人。

