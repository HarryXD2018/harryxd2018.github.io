#      bibendum fringilla a eu lectus.
    papers:
      - title: 'MindFlow: Harmonizing Cognitive Semantics and Acoustic Dynamics for Facial Animation Generation in Dyadic Conversations'
        link: https://harryxd2018.github.io/MindFlow/
        authors: '<strong>H. Chen</strong>, H. Zhang, X. He, *et al.*'
        conference: ECCV'26
        first_author: true
        year: 2026
        teaser: 'assets/images/teaser_mf26.gif'
        tldr: '
        We tackle rigid and emotionally hollow facial expressions in dyadic conversation animation
        by enabling ==continuous emotion reasoning from streaming audio==
        and seamless facial motion generation across both speaking and listening states.
        '

    
      - title: 'Cafe-Talk: Generating 3D Talking Face Animation with Multimodal Coarse- and Fine-grained Control'
        link: https://harryxd2018.github.io/cafe-talk
        authors: '<strong>H. Chen</strong>, H. Zhang, S. Zhang, *et al.*'
        conference: ICLR'25
        first_author: true
        year: 2025
        teaser: 'assets/images/teaser_iclr25.gif'
        tldr: '
        We tackle the challenge of generating 3D talking face animations with controllable expressions.
        We propose Cafe-Talk, which ==integrates coarse- and fine-grained multimodal controls== to disentangle conditions, synchronize lip movements, enhance expressiveness, and enable precise control.
        '


      - title: Sequential Texts Driven Cohesive Motions Synthesis with Natural Transitions
        link: https://druthrie.github.io/sequential-texts-to-motion/
        authors: 'S. Li, S. Zhuang, W. Song, X. Zhang, <strong>H. Chen</strong>, A. Hao'
        conference: ICCV'23
        first_author: false
        year: 2023
        teaser: 'assets/images/teaser_iccv23.gif'
        tldr: 'We address the problem of ==synthesizing seamless human motion
        from sequential texts with semantic coherence and natural transitions.== It uses a framework with
        L2G semantic fusion and transition reasoning modules, along with a custom transition loss and a new STDM dataset.'

      - title: 'From Inpainting to Editing: A Self-Bootstrapping Framework for Context-Rich Visual Dubbing'
        link: https://hjrphoebus.github.io/X-Dub/
        authors: 'X. He, H. Zhang, <strong>H. Chen</strong>, *et al.*'
        conference: ICML'26
        first_author: false
        year: 2023
        teaser: 'assets/images/teaser_icml26.png'
        tldr: '
        We tackle the identity drift, lip-shape leakage, and fragility of mask-based inpainting in audio-driven visual dubbing.
        We propose X-Dub, which ==repurposes an inpainting model as a pseudo-paired data generator to bootstrap a mask-free editing dubber==,
        with timestep-adaptive multi-phase learning and a new X-DubBench benchmark.
        '
