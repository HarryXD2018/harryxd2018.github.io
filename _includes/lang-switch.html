{%- comment -%}
  语言切换：英文为默认版本（/），中文版在 /zh/。
  内容分别取自 _data/data.yml 与 _data/data_cn.yml。
{%- endcomment -%}
<div class="lang-switch">
  {% if page.lang == "cn" %}
  <a href="{{ site.baseurl }}/" title="Switch to English"><i class="fas fa-globe"></i> English</a>
  {% else %}
  <a href="{{ site.baseurl }}/zh/" title="切换到中文"><i class="fas fa-globe"></i> 中文</a>
  {% endif %}
</div>

<style>
  .lang-switch {
    text-align: center;
    margin-top: 10px;
  }
  .lang-switch a {
    display: inline-block;
    padding: 2px 12px;
    font-size: 0.85em;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 12px;
    color: inherit;
    opacity: 0.85;
    text-decoration: none;
  }
  .lang-switch a:hover {
    opacity: 1;
    border-color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
  }
</style>
